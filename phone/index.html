<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One Day, Two Towns · Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c120d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&family=Mrs+Saint+Delafield&display=swap">
<link rel="stylesheet" href="phone.css">
</head>
<body>
<header class="bar">
  <span class="sig">Yanis</span>
  <span class="status" id="status"><i></i><span id="status-t">Live</span></span>
  <div class="lang" role="group" aria-label="Language">
    <button id="l-en" aria-pressed="true">EN</button><button id="l-fr" aria-pressed="false">FR</button>
  </div>
</header>
<div class="prog" id="prog" aria-hidden="true"><i id="prog-i"></i></div>

<main id="main">
  <section class="welcome" id="welcome">
    <p class="eyebrow" data-t="welcomeEyebrow"></p>
    <h1 data-t="welcomeTitle"></h1>
    <p class="lead" data-t="welcomeLead"></p>
    <ul class="how">
      <li><b>📺</b><span data-t="how1"></span></li>
      <li><b>👏</b><span data-t="how2"></span></li>
      <li><b>🗳️</b><span data-t="how3"></span></li>
    </ul>
    <p class="privacy"><b>🔒</b><span data-t="privacy"></span></p>
  </section>

  <section class="ended" id="ended" hidden>
    <p class="icon">👋</p>
    <h1 data-t="ended"></h1>
    <p class="lead" data-t="endedLead"></p>
    <p class="how1"><b>📷</b><span data-t="endedHow"></span></p>
  </section>

  <section class="now" id="now" hidden>
    <div class="meta"><span class="chip" id="chip"></span><span class="clock" id="clock"></span></div>
    <div class="icon" id="icon"></div>
    <p class="place" id="place"></p>
    <p class="cap" id="cap"></p>
    <p class="capfr" id="capfr" hidden></p>
    <p class="src" id="src" hidden></p>
    <p class="lost" id="lost" hidden><small data-t="lostLabel"></small><b id="lost-v"></b></p>
  </section>

  <section class="extra" id="tech" hidden><h2 data-t="tech"></h2><p id="tech-t"></p></section>
  <section class="extra you" id="you" hidden><h2 data-t="you"></h2><p id="you-t"></p></section>


  <section class="calc" id="calc" hidden>
    <h2 data-t="calcTitle"></h2>
    <label for="calc-m" data-t="calcQ"></label>
    <div class="slide"><input type="range" id="calc-m" min="0" max="120" step="5" value="30"><output id="calc-mv">30 min</output></div>
    <p class="big" id="calc-y"></p>
    <p class="small" id="calc-s"></p>
  </section>

  <section class="poll" id="poll" hidden></section>

  <section class="thanks" id="thanks" hidden>
    <p class="sig">Yanis</p>
    <p data-t="thanks"></p>
  </section>
</main>

<nav class="reacts" id="reacts" aria-label="React on the board">
  <button data-e="😮">😮</button><button data-e="😤">😤</button><button data-e="😂">😂</button>
  <button data-e="👏">👏</button><button data-e="💡">💡</button><button data-e="❤️">❤️</button>
</nav>

<script src="../js/polls.js"></script>
<script src="content.js"></script>
<script src="phone.js"></script>
</body>
</html>
